<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<style>
body { margin: 0; background: transparent; display: flex; align-items: center; justify-content: center; min-height: 100vh; }
.logo { display: flex; align-items: center; gap: 20px; padding: 40px; }
.logo svg { width: 80px; }
.text { font-family: 'Segoe UI', Arial, sans-serif; font-weight: 900; font-size: 48px; color: #3D2B1F; letter-spacing: -1px; }
.text .hi { color: #C4683C; }
.text .badge { display: inline-block; background: #C4683C; color: white; font-size: 16px; font-weight: 800; padding: 4px 12px; border-radius: 8px; margin-left: 6px; vertical-align: super; }
.tagline { font-family: 'Segoe UI', Arial, sans-serif; font-size: 14px; font-weight: 600; color: #7A6B5D; letter-spacing: 3px; text-transform: uppercase; margin-top: 8px; }
</style>
</head>
<body>
<div class="logo">
  <svg viewBox="0 0 100 120" xmlns="http://www.w3.org/2000/svg">
    <defs><linearGradient id="g" x1="0%" y1="0%" x2="100%" y2="100%"><stop offset="0%" stop-color="#FF6B35"/><stop offset="100%" stop-color="#E84E1B"/></linearGradient></defs>
    <ellipse cx="50" cy="88" rx="30" ry="26" fill="url(#g)"/>
    <ellipse cx="20" cy="52" rx="14" ry="17" fill="url(#g)"/>
    <ellipse cx="50" cy="38" rx="13" ry="16" fill="url(#g)"/>
    <ellipse cx="80" cy="52" rx="14" ry="17" fill="url(#g)"/>
    <path d="M50 98 C50 98 36 86 36 80 C36 76 40 73 44 75 C46 76 48 78 50 81 C52 78 54 76 56 75 C60 73 64 76 64 80 C64 86 50 98 50 98Z" fill="white" opacity="0.95"/>
  </svg>
  <div>
    <div class="text">Mi<span class="hi">Fido</span>Di<span class="hi">Te</span><span class="badge">.eu</span></div>
    <div class="tagline">Il magazine pet d'Italia</div>
  </div>
</div>
</body>
</html>
